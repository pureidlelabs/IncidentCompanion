# The gate a pull request into `main` has to pass.
#
# **It decides whether the change broke what it touched**, not whether `main`
# is green -- that is `nightly-build.yml`'s question. So a tier whose inputs did not
# move is not run, and a tier that did not run does not fail the gate: `gate`
# passes on `skipped`.
#
# **Cheap before expensive.** `lint`, `build` and `repository` are one tier and
# the suites `needs:` them, so a lint error is never paid for by five shards.
#
# **The two events divide the work.** A pull request proves the branch lints,
# builds and passes the repository checks; the merge group proves the tree that
# ships, which is where the suites and the image live.
#
# **Every `github.event.pull_request.*` field is null in a merge group**, and
# null compares false rather than erroring -- so a condition reading one skips
# its job in silence and `gate` passes it. Every condition reads the event
# first for that reason, and `test_no_tier_runs_on_neither_event` keeps it true.
#
# **`gate` is the check to require, and the only one.** A shard's name carries
# its index; `gate`'s does not move.
#
# **No `paths:` filter on the trigger**, because a workflow skipped by one
# reports no status at all and a required check that never reports blocks the
# pull request for ever. The conditions are on the jobs, which report success
# when skipped.
#
# **Changed paths are worked out with git**, and actions are pinned by commit:
# `tj-actions/changed-files` was compromised in March 2025 by repointing its
# version tags, which leaked CI secrets from around 23,000 repositories.

name: Verify

on:
  pull_request:
    branches: [main]
    # Naming any type replaces the default three rather than adding to them.
    # `ready_for_review` is the addition: a draft waits until it is offered.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # **`nightly-build.yml` calls this**, so a tier is stated once rather than copied.
  # `all` stands in for the scope, which a scheduled run has no diff to take.
  #
  # **`github.event_name` in a called run is the caller's** -- `schedule` -- so
  # every `merge_group` condition is false there. Same null trap as above: drop
  # `all` from a tier and it skips while `gate` reports green.
  workflow_call:
    inputs:
      all:
        description: Run every tier, whatever the diff says.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A merge group has no pull request number, and the bare `ci-` that leaves
  # would put every queued entry in one group to cancel each other.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseding a pull request run is right; superseding a merge group run
  # fails the queue entry that is waiting on it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------- scope
  scope:
    # **A draft runs the cheap tiers.** Holding every tier until a branch is
    # offered moves a lint error, a type error and a repository check to the
    # moment you want to land, which is the most expensive moment to find one.
    # The draft gate is on the expensive tiers instead, where it buys something.
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.scope.outputs.server }}
      client: ${{ steps.scope.outputs.client }}
      screen: ${{ steps.scope.outputs.screen }}
      linters: ${{ steps.scope.outputs.linters }}
      shell: ${{ steps.scope.outputs.shell }}
      actions: ${{ steps.scope.outputs.actions }}
      renovate: ${{ steps.scope.outputs.renovate }}
      devcontainer: ${{ steps.scope.outputs.devcontainer }}
      containers: ${{ steps.scope.outputs.containers }}
      prose: ${{ steps.scope.outputs.prose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: What changed
        id: scope
        env:
          # A branch name is written by whoever opened the pull request, so it
          # is a value here rather than shell inside `run:`.
          HEAD_REF: ${{ github.head_ref }}
          # Empty in any event but these two, which is why `ALL` exists: `git
          # diff` would compare nothing and every tier read as out of scope.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          ALL: ${{ inputs.all }}
        run: |
          # A called run has no base to diff against and wants every tier.
          if [ "$ALL" = "true" ]; then
            echo 'every tier, asked for by the caller'
            for tier in server client shell actions renovate devcontainer containers prose; do
              echo "$tier=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          # **Three dots, so the base is the merge base.** Two dots compares
          # the tip of `main` to this head, so whatever landed on `main` after
          # the branch was cut reads as this branch's change, inverted -- and a
          # branch behind `main` scopes in tiers it never touched.
          changed="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")"
          echo "$changed"
          match() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }

          # A manifest or lockfile moves versions under both tiers.
          deps="$(match '^(package\.json|package-lock\.json|packages/|server/package\.json|ui/package\.json)')"

          # A path cannot say why the lockfile moved; the branch name can, and
          # Renovate builds it from the `group:linters` preset's own name. A
          # rename there means the suites run, which is the safe direction.
          if [ "$HEAD_REF" = "renovate/linters" ]; then deps=false; fi

          server="$(match '^(server/|packages/)')"
          client="$(match '^(ui/|packages/)')"

          # **Its own filter rather than `client`.** The story tier's specs and
          # harness live under `server/e2e/`, which `client` would leave unrun,
          # while `client` fires on the tool configs and on `ui/**/*.test.tsx`
          # -- neither of which can change a rendered story, and each of which
          # would pay for a browser. Unit tests are dropped before the match
          # for that second reason.
          screen=false
          printf '%s\n' "$changed" | grep -vE '\.test\.tsx?$' \
            | grep -qE '^(ui/src/|ui/\.storybook/|ui/package\.json|ui/vite\.config\.|server/e2e/visual/|server/e2e/support/)' \
            && screen=true
          [ "$deps" = true ] && server=true && client=true && screen=true

          shell="$(match '\.sh$')"
          actions="$(match '^\.github/(workflows|actions)/')"
          renovate="$(match '^\.github/renovate\.json5$')"
          prose="$(match '^(openspec/|\.claude/|\.devcontainer/|tests/|server/src/|server/test/|ui/src/|README\.md)')"

          # **A shard per unit of work, not per linter.** `actionlint`,
          # `renovate`, `shellcheck`, `vale` and the byte lint are seconds each;
          # a shard of their own pays a checkout, a node install and a mise
          # install to spend them, and the tier is bounded by `client` either
          # way. So the four tool linters share one shard and the two eslint
          # runs keep theirs.
          #
          # `jq -R` quotes each name, `-sc` folds them into the one-line array
          # `fromJSON` wants.
          selected=""
          [ "$server" = true ] && selected="${selected}server\n"
          [ "$client" = true ] && selected="${selected}client\n"
          # The byte lint is unscoped -- every file in the tree is its subject --
          # so the tool shard exists whenever any linter does, and it rides
          # along rather than running on a diff that selected nothing.
          if [ -n "$selected" ] || [ "$actions" = true ] || \
             [ "$renovate" = true ] || [ "$shell" = true ] || \
             [ "$prose" = true ]; then
            selected="${selected}tools\n"
          fi
          linters="$(printf '%b' "$selected" | jq -R . | jq -sc .)"

          {
            echo "server=$server"
            echo "client=$client"
            echo "screen=$screen"
            echo "shell=$shell"
            echo "actions=$actions"
            echo "renovate=$renovate"
            echo "prose=$prose"
            echo "linters=$linters"
            echo "devcontainer=$(match '^\.devcontainer/')"
            echo "containers=$(match '^(\.devcontainer/|docker/|compose.*\.yaml|tests/docker/)')"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------- lints
  # **Three tools, not the ten `.devcontainer/mise.toml` pins** -- the rest are
  # the container's, and `install_args` is what keeps the pins in one file
  # without installing a second Node beside `setup-node`'s. The config is named
  # rather than found: every `run:` stands at the root, where a shim finds none.
  lint:
    needs: scope
    # **Three shards at most, and `scope` decides which exist.** A shard that
    # discovers it has nothing to do is a checkout and an install spent on
    # nothing.
    if: needs.scope.outputs.linters != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        linter: ${{ fromJSON(needs.scope.outputs.linters) }}
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.devcontainer/mise.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node

      # Only the tool shard wants a binary mise pins. The eslint shards do not
      # wait for it.
      #
      # **`cache_key` because the default one cannot see the pins.** It hashes
      # whatever `MISE_CONFIG_FILE_PATTERNS` globs, which is the root
      # `mise.toml`; the versions are in `.devcontainer/mise.toml`, named by
      # `MISE_GLOBAL_CONFIG_FILE` and matched by no glob. So a Renovate bump to
      # `vale` or `actionlint` left the key unmoved and the cache served the
      # previous binary -- the tier reporting on a version the file does not
      # pin. `{{default}}` keeps every component the action already puts in.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: matrix.linter == 'tools'
        with:
          install_args: actionlint vale shellcheck
          cache_key: "{{default}}-${{ hashFiles('.devcontainer/mise.toml') }}"

      # **`if` rather than `[ ... ] && ...` for each tool.** `run:` is `bash -e`,
      # where a test that answers false is the last command of the list and
      # takes the step with it -- so the guard would end the shard rather than
      # skip the linter, and the ones after it would never run.
      - name: ${{ matrix.linter }}
        env:
          LINTER: ${{ matrix.linter }}
          WANT_ACTIONS: ${{ needs.scope.outputs.actions }}
          WANT_RENOVATE: ${{ needs.scope.outputs.renovate }}
          WANT_SHELL: ${{ needs.scope.outputs.shell }}
          WANT_PROSE: ${{ needs.scope.outputs.prose }}
        run: |
          case "$LINTER" in
            server) cd server && npm run --silent lint ;;
            client) cd ui && npm run --silent lint ;;
            tools)
              # The version line before each tool: a shard that silently ran no
              # linter is the failure this whole tier exists to stop being
              # possible.
              #
              # `actions` because a YAML parser passes a broken workflow, the
              # expressions and the shell inside `run:` both being opaque to it.
              # `renovate` because a malformed rule matches nothing, and
              # Renovate reports a clean run for having skipped it.
              # `bytes` over the whole tree rather than the diff: the five stray
              # bytes it first caught had been on `main` since the import, under
              # paths no tier reached.
              if [ "$WANT_ACTIONS" = true ]; then
                actionlint --version
                npm run --silent lint:actions
              fi
              if [ "$WANT_RENOVATE" = true ]; then
                npm run --silent lint:renovate
              fi
              if [ "$WANT_SHELL" = true ]; then
                shellcheck --version
                npm run --silent lint:shell
              fi
              if [ "$WANT_PROSE" = true ]; then
                vale --version
                npm run --silent lint:prose
              fi
              npm run --silent lint:ascii
              ;;
            *) echo "no such linter: $LINTER" >&2; exit 1 ;;
          esac

  # -------------------------------------------------------- types and builds
  # A build does not typecheck and `tsc -b` does not emit, so neither stands in
  # for the other.
  build:
    needs: scope
    if: >-
      needs.scope.outputs.server == 'true' ||
      needs.scope.outputs.client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Server typecheck
        if: needs.scope.outputs.server == 'true'
        run: cd server && npm run --silent typecheck
      - name: Client typecheck
        if: needs.scope.outputs.client == 'true'
        run: cd ui && npx tsc -b --noEmit --force
      - name: Server build
        if: needs.scope.outputs.server == 'true'
        run: cd server && npm run --silent build
      - name: Client build
        if: needs.scope.outputs.client == 'true'
        run: cd ui && npm run --silent build

  # ------------------------------------------------------------------ the tree
  # Reads the repository rather than running it, so it needs no stack. It does
  # need `node_modules`: `tests/contract` resolves shared dependencies from
  # both workspaces, and `tests/repo` runs the OpenSpec CLI from the pinned dev
  # dependency. `-n auto` is paired with `--dist loadfile`, which
  # `tests/repo/test_platform_portability.py` holds true.
  repository:
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      # The history is part of what this tier reads: `.claude/tests` runs
      # `test_scope.py`, which asks git for `HEAD~1..HEAD`. The other tiers
      # stay shallow, and one that turns out to need history fails loudly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # **`tests/contract` reads the installed tree, not just the manifests.**
      # `test_every_shared_dependency_resolves_to_one_copy` resolves each shared
      # dependency from both workspaces and compares the paths, which needs
      # `node_modules` to exist. Without this step it skipped in every run here
      # and reported as a pass -- the one check of that property in the whole
      # pipeline, declining silently. -> #61
      - uses: ./.github/actions/node
      - name: Repository checks
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest tests/docs tests/repo tests/contract .claude/tests \
            -q -n auto --dist loadfile

  # ------------------------------------------------------------- server suite
  # **Sharded across runners, so each shard gets its own cluster.** The suite
  # keeps a case scope inside a transaction, and one backend multiplexing two
  # shards is that defect at a larger scale.
  #
  # **`needs: scope` alone, so the longest tier stops starting last.** `lint`,
  # `build` and `repository` were a fail-fast gate rather than a dependency:
  # `build` uploads no artifact, this downloads none, and they run on separate
  # runners, so nothing one produces can reach the other. What the gate bought
  # was skipping the suites when a linter was red; what it cost was every suite
  # waiting for the slowest cheap tier before starting. Measured on the merge
  # group run of 2026-09-04T16:44Z: `repository` finished at 0:55 and `build` at
  # 1:34, five runners then idled until 2:21 for `lint`, and the run took 6:49
  # for a longest job of 4:22.
  #
  # The trade is a red linter now costing a suite run. `needs` is static, so it
  # cannot be a gate on a pull request and open in the queue; and a branch
  # reaches either one having already linted green as a draft.
  server-suite:
    needs: scope
    if: >-
      !failure() && !cancelled() &&
      (github.event_name == 'merge_group' || inputs.all ||
       github.event.pull_request.draft == false) &&
      needs.scope.outputs.server == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: incidentcompanion
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # `db:push` reads this one. The suite does not.
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/incidentcompanion

      # **The three the suite actually reads**, from `vitest.config.mts`. Unset,
      # it falls back to `stack.mjs`, finds no cluster and takes its embedded
      # in-process engine instead of failing -- which drops every write path.
      # `_test` is required: `global-setup.ts` refuses any other name, which is
      # what stands between its truncation and a live database.
      ADMIN_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/incidentcompanion
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/incidentcompanion_test
      SEED_DATABASE_URL: postgres://ic_seed:ic_seed@127.0.0.1:5432/incidentcompanion_test
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node

      # The suite declines rather than fails when the stack is absent, and
      # exits 0. Without this, a service that never started is a green job.
      - name: The stack is actually up
        run: |
          node -e '
            const net = require("node:net")
            const probe = (port) => new Promise((res, rej) => {
              const s = net.connect(port, "127.0.0.1")
              s.on("connect", () => { s.end(); res() })
              s.on("error", rej)
            })
            Promise.all([probe(5432), probe(6379)])
              .then(() => console.log("Postgres and Redis are listening"))
              .catch(() => { console.error("a service is not listening; the suite would skip and report success"); process.exit(1) })
          '

      # **The roles are cluster-wide, and a service container has none**, so
      # `db:push` fails on the first `CREATE POLICY`. `stack.mjs --roles`
      # cannot serve: it reaches its cluster through `docker compose exec`, and
      # this cluster is GitHub's. The passwords are the role names, matching
      # what `asRole` builds -- a fixture for a cluster that lives one job.
      - name: Database roles
        run: |
          cat docker/db/roles.sql docker/db/role-passwords.sql |
            docker run --rm -i --network host -e PGPASSWORD=ci \
              postgres:18.6-alpine \
              psql -v ON_ERROR_STOP=1 \
                   -v ic_migrate_password=ic_migrate \
                   -v ic_seed_password=ic_seed \
                   -v ic_app_password=ic_app \
                   -q -h 127.0.0.1 -U postgres -d incidentcompanion

      - name: Schema
        run: cd server && npm run --silent db:push

      # **A port being open does not mean the suite is using it.** The probe
      # above passed while the suite ran on its embedded engine, warning to a
      # log nothing reads and exiting 0. This is what reads it.
      - name: Server suite
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          cd server
          npx vitest run --pool=threads --shard="$SHARD/2" 2>&1 | tee ../suite.log
          if grep -q 'in-process engine' ../suite.log; then
            echo 'the suite ran on the embedded engine; no write path touched Postgres'
            exit 1
          fi

  # ------------------------------------------------------------- client suite
  # The longest tier, and the one nothing waits on. jsdom is single-threaded
  # per file and the files are independent, so the shard count is free.
  client-suite:
    needs: scope
    if: >-
      !failure() && !cancelled() &&
      (github.event_name == 'merge_group' || inputs.all ||
       github.event.pull_request.draft == false) &&
      needs.scope.outputs.client == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Client suite
        env:
          SHARD: ${{ matrix.shard }}
        run: cd ui && npx vitest run --shard="$SHARD/3"

  # -------------------------------------------------------------- the image
  # **A build that succeeds proves the image assembled, not that it works** --
  # the shims, the PATH and what a non-root user can read are exercised by the
  # smoke run rather than by `docker build`. The runner is also amd64, which a
  # session's machine is not.
  # --------------------------------------------------------------- the screen
  # **The only tier that sees a component laid out.** Every other client check
  # is jsdom, where an element's box is `0px`, so a layout or a contrast defect
  # is invisible to `src/**/*.test.tsx` by construction.
  #
  # **The browser install is what makes this a gate rather than a green no-op.**
  # `ui/vite.config.ts` drops the `storybook` project from `projects` when
  # Playwright's Chromium is absent, warns once and exits 0 -- so without this
  # step the job would report success having run none of the stories.
  client-screen:
    needs: scope
    if: >-
      !failure() && !cancelled() &&
      (github.event_name == 'merge_group' || inputs.all ||
       github.event.pull_request.draft == false) &&
      needs.scope.outputs.screen == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node

      # Keyed on the lockfile, which is what moves `@playwright/test`: a tree
      # restored by `npm ci` carries the package and never the browser.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: >-
            playwright-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('package-lock.json') }}

      - name: The browser the story tier needs
        run: cd ui && npx playwright install --with-deps chromium

      - name: Story tier
        env:
          SHARD: ${{ matrix.shard }}
        run: cd ui && npx vitest run --project=storybook --shard="$SHARD/2"

  devcontainer:
    needs: scope
    if: >-
      !failure() && !cancelled() &&
      (github.event_name == 'merge_group' || inputs.all ||
       github.event.pull_request.draft == false) &&
      needs.scope.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Devcontainer
        run: |
          docker build -t ic-devcontainer .devcontainer
          docker run --rm ic-devcontainer bash /usr/local/bin/ic-smoke.sh

  # ------------------------------------------------------------- the containers
  # **`tests/docker` ran locally and in no job here.** `test.sh` runs `pytest
  # tests` unqualified so it reached the local sweep; `ci.yml` names four
  # directories and this was not one, which is how four failures sat at head
  # unseen. `verify.sh --detailed` is the local half of the same tier.
  #
  # In the merge group with the other expensive tiers: it builds images and
  # resolves the compose stack, which is the tree that ships rather than the
  # branch's own question.
  #
  # **`INCIDENTCOMPANION_CONTAINER_TESTS` is what makes the tier run the thing
  # it is named for.** Without it the runtime tests skip and the job reports
  # green in five seconds, which is how the built output stayed unexecuted after
  # the tier itself was added.
  #
  # **`docker/secrets.sh` first, or none of them get as far as a build.** Every
  # credential is `${NAME:?...}` rather than defaulted, so compose refuses to
  # interpolate until the file exists. The script is idempotent and writes a
  # gitignored `.env`.
  containers:
    needs: scope
    if: >-
      !failure() && !cancelled() &&
      (github.event_name == 'merge_group' || inputs.all ||
       github.event.pull_request.draft == false) &&
      needs.scope.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The container files
        env:
          INCIDENTCOMPANION_CONTAINER_TESTS: '1'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          sh docker/secrets.sh
          .venv/bin/python -m pytest tests/docker -q -n auto --dist loadfile

  # ---------------------------------------------------------------- the gate
  # **The one check to require on `main`.** `always()` is what makes it report
  # on a run where a tier failed; without it a failed dependency skips this
  # job, and a skipped required check reads as success.
  #
  # A draft runs the cheap tiers, so this reports there too and the branch has
  # a verdict before it is offered.
  #
  # `skipped` passes -- that is how a tier says its paths did not move.
  # `cancelled` does not: that run's verdict is not the head commit's.
  gate:
    if: always()
    needs:
      [scope, lint, build, repository, server-suite, client-suite, client-screen, devcontainer, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: Every tier
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          failed=false
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a tier reported $result"; failed=true ;;
            esac
          done
          if [ "$failed" = true ]; then exit 1; fi
          echo 'every tier reported success or was out of scope'
