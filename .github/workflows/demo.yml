# The evaluation build, published where somebody can judge the product without
# installing it.
#
# **It publishes after a green `Baseline`, not on a push to `main`.** The merge
# queue proves what one pull request touched; `baseline.yml` runs every tier
# against the whole tree, so a demo published from it is one the suites and the
# image have both answered for. That ordering is also what keeps the demo's own
# coverage check out of `gate`: a break fails the suite, this never runs, and
# yesterday's demo stays up.
#
# **A skipped `Baseline` still concludes success**, on a night where `main` has
# not moved and no tier ran. Publishing then republishes the same tree, which
# costs a run and changes nothing.
#
# **`workflow_dispatch` is how a branch is looked at before it lands.** The
# `github-pages` environment decides whether a ref other than the default branch
# may deploy, so a branch preview is a deliberate setting rather than something
# this file grants itself.
name: Demo

on:
  workflow_dispatch:
  # TEMPORARY, and it comes out before this lands: a workflow is dispatchable
  # only from the default branch, so this is the only way to look at the demo
  # before it is on `main`.
  push:
    branches: [feature/a-browser-only-demo-build]
  workflow_run:
    workflows: [Baseline]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  publish:
    # A failed `Baseline` publishes nothing and leaves the last demo up.
    #
    # **Written as "not a `workflow_run`, or a green one"** rather than as a
    # list of the events that may publish. `github.event.workflow_run` is null
    # on every other event and null compares false, so a condition naming the
    # events it accepts silently skips the one nobody remembered to add -- which
    # is what this did to its own `push` trigger.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # What `deploy-pages` needs, and it is scoped to this job rather than the
      # workflow so nothing else in the file can write a deployment.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      # **Before the build, for `base_path`.** A site at a custom domain serves
      # from the origin root and one at `<owner>.github.io/<repo>/` does not,
      # and every asset path and the router's basename carry the difference.
      # Asking Pages what it is means adding or removing a custom domain needs
      # no change here; hardcoding either one breaks the moment it moves.
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # The stamp the page shows, so a demo that stopped being republished is
      # legible from the page rather than from a workflow nobody is watching.
      - name: Build
        working-directory: ui
        env:
          VITE_DEMO_BUILD: ${{ github.sha }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          export VITE_DEMO_BUILD="${VITE_DEMO_BUILD:0:7}"
          # `base_path` is empty at a custom domain and has no trailing slash
          # otherwise; Vite wants one at both ends.
          export DEMO_BASE="${BASE_PATH%/}/"
          echo "building for base $DEMO_BASE"
          npm run build:demo

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v3.0.1
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
