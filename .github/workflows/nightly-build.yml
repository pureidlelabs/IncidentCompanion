# What `main` actually is, nightly.
#
# `ci.yml`'s merge group decides whether the tree that lands is sound. This asks
# what the tiers no merge group runs say, and catches drift that arrives from
# no merge at all -- a moved base image, a yanked package, a runner changed
# underneath the pins.
#
# **It runs `ci.yml` rather than restating it**, so a tier cannot exist in one
# file and not the other. `all: true` replaces the scope, and each tier reports
# as its own job.
#
# **Not a required check, and it cannot become one** -- it never runs on a pull
# request, so requiring it would leave every one waiting for a status that is
# not coming.

name: Nightly build

on:
  schedule:
    # A scheduled run is queued rather than promised, and GitHub drops them
    # entirely after 60 days without activity -- so a silent night is a thing
    # to check rather than a thing to trust.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Reading this workflow's own past runs is how it knows whether `main` has
  # moved since it last answered.
  actions: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  # **Skip a night whose answer is already recorded, but not indefinitely.**
  # Most tiers are a function of the tree, so an unchanged `main` cannot answer
  # differently -- except in the case a nightly exists for: an image that
  # moved under its tag, a package yanked, a runner changed beneath the pins.
  # None of those touch a commit, so the floor is four weeks.
  changed:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Has main moved since the last green nightly
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'asked for by hand'
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last="$(gh api "/repos/$REPO/actions/workflows/nightly-build.yml/runs" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")][0]
                  | "\(.head_sha) \(.created_at)"' 2>/dev/null || true)"

          # No previous green run, so there is no record to lean on.
          if [ -z "$last" ]; then
            echo 'no previous green nightly'
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha="${last%% *}"
          last_at="${last##* }"
          echo "last green nightly: $last_sha at $last_at"
          echo "main is now: $HEAD_SHA"

          if [ "$last_sha" != "$HEAD_SHA" ]; then
            echo 'main has moved'
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last_at" +%s) ) / 86400 ))
          echo "unchanged for $age_days days"
          if [ "$age_days" -ge 28 ]; then
            echo 'four weeks since the last answer, so the world may have moved even if the tree has not'
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo 'unchanged and recently answered; nothing here could report differently'
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Every tier, because a nightly asks what `main` is rather than what a diff
  # touched. Each job pays its own checkout and install, bought back in
  # parallelism and spent only on a night the tree moved.
  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    # A called job can only narrow this grant, so it covers what `certify` reads.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      all: true

  # **A red night is said where somebody reads it.** A scheduled run reports
  # to no pull request, so a failure opens one issue labelled `nightly-red`,
  # or comments on the one already open. -> #89
  report:
    needs: [changed, nightly]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    steps:
      - name: File the failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The backticks are markdown for the issue and the interpolation is
          # jq's, so neither is the shell's to expand.
          # shellcheck disable=SC2016
          failed="$(gh api "/repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- `\(.name)`"' | sort -u)"
          [ -n "$failed" ] || failed="- (no job reported a failure; the run itself did)"

          {
            echo "**The nightly build of \`$HEAD_SHA\` failed.** [The run]($RUN_URL)"
            echo
            echo "Failed:"
            echo "$failed"
          } > body.md

          gh label create nightly-red --repo "$REPO" \
            --color B60205 --description 'The nightly build failed' 2>/dev/null || true
          open="$(gh issue list --repo "$REPO" --label nightly-red --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body-file body.md
          else
            gh issue create --repo "$REPO" --title 'The nightly build is red' \
              --label nightly-red --label bug --body-file body.md
          fi
