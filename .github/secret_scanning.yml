# Fixtures a scanner reads as credentials, correctly: each one is a connection
# string with a password in it. They are the test rather than an oversight --
# `whereItPoints` exists to drop a password out of a connection string, and
# nothing proves it does that without a password to drop.
#
# **A path named here leaves push protection as well as the alert list**, so an
# entry is a blind spot rather than a filter. That is why this names files and
# never `server/src/health/`.
#
# `s3cr3t-passw0rd` is in both health tests, so naming one and not the other
# leaves the same literal sitting in a file that is still read.
paths-ignore:
  - "server/src/health/install.controller.test.ts"
  - "server/src/health/dependencies.health.test.ts"
  - ".claude/review/comment-ledger.jsonl"
