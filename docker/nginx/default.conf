# The stack's only door to the host. The app serves plaintext on the compose
# network and publishes nothing, so this is the whole of what a browser meets.

# **`$connection_upgrade` is not built in**, and its absence is quiet: an unset
# variable is the empty string, so `Connection: ` is sent, the upgrade is
# answered as an ordinary request, and every socket the app relies on --
# presence, claims, the report CRDT -- fails without an error anybody sees.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# **A global ceiling, not per-caller.** `$binary_remote_addr` reads as one
# bucket per client and is not: a `127.0.0.1:` publish is NAT, so every caller
# arrives as the Docker bridge gateway and one key covers the machine -- here
# and in the app's `x-real-ip` keying alike. This bounds credential stuffing
# and nothing finer, and one local caller can empty the bucket for everybody:
# accepted while every caller is the analyst themselves, and to revisit behind
# an ingress that preserves the client address.
limit_req_zone $binary_remote_addr zone=ic_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ic_all:10m rate=30r/s;

# A single browser opens several connections per page; 64 is generous for one
# analyst and still bounds a single host opening thousands.
limit_conn_zone $binary_remote_addr zone=ic_conn:10m;

# 429, not nginx's 503 default: a client that retries needs to know it was rate
# limited rather than that the service is down.
limit_req_status 429;
limit_conn_status 429;

# **Anything that is not a name this certificate answers to gets nothing.**
# This block is the stack's whole DNS-rebinding defence -- there is no loopback
# `Host` allowlist behind it. 444 closes the connection without a response, so
# a rebinding probe learns nothing about what is there.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # **No protocol list and no cipher list on purpose**: OpenSSL negotiates
    # 1.3 and refuses the withdrawn ones, so the policy tracks the library. A
    # suite string here would freeze it at the day somebody typed it.
    ssl_session_timeout 1d;
    ssl_session_cache shared:IC:10m;
    ssl_session_tickets off;

    # **No HSTS**, deliberately: on `localhost` it pins every other project on
    # this machine to https, outliving this app.

    # Evidence uploads are the largest body this app accepts; the default 1m
    # would refuse them with a 413 that reads as a broken upload control.
    client_max_body_size 512m;

    # The SPA is served by the app, so compression is decided here rather than
    # in two places. `gzip_proxied any` is required: responses arrive with
    # proxy headers and are otherwise left uncompressed.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml
               image/svg+xml text/css text/javascript text/plain;

    limit_conn ic_conn 64;

    # **The credential paths, tighter than everything else.** Sign-in, sign-up
    # and password change are where an attacker spends requests; the rest of the
    # app is an analyst clicking around and must not share their budget.
    location /api/auth/ {
        limit_req zone=ic_auth burst=20 nodelay;
        limit_req zone=ic_all burst=60 nodelay;
        include /etc/nginx/ic-proxy.inc;
    }

    location / {
        limit_req zone=ic_all burst=60 nodelay;
        include /etc/nginx/ic-proxy.inc;
    }
}
