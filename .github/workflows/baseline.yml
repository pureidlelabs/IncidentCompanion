# What `main` actually is, nightly.
#
# **`ci.yml` decides whether a change broke what it touched, and deliberately
# runs nothing else.** That is only safe while something establishes the record
# it is measuring against -- otherwise "unchanged since it was last proven" is
# measured against a proof nobody ever produced. `ci.yml` triggers on
# `pull_request` and `merge_group` alone, so until this file existed, nothing
# had ever run against `main` itself.
#
# It also catches what a path rule cannot: two branches green apart and broken
# together, and drift that arrives from no merge at all -- a moved base image,
# a yanked package, a runner that changed underneath the pins.
#
# **It runs `ci.yml` rather than restating it.** Every tier used to appear
# twice, which made a tier added to one and not the other invisible. `all:
# true` is what replaces the scope, and the tiers report as separate jobs --
# so `gate`'s verdict says what is red without a step here collecting it.
#
# **Not a required check, and it cannot become one** -- it never runs on a pull
# request, so requiring it would leave every pull request waiting for a status
# that is not coming.

name: Baseline

on:
  schedule:
    # Every day, 03:00 UTC. A scheduled run is queued rather than promised, and
    # GitHub drops them entirely when a repository has had no activity for 60
    # days -- so a silent night is a thing to check rather than a thing to trust.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Reading this workflow's own past runs is how it knows whether `main` has
  # moved since it last answered.
  actions: read

concurrency:
  group: baseline
  cancel-in-progress: false

jobs:
  # **Skip a night whose answer is already recorded, but not indefinitely.**
  # Most tiers are a function of the tree, so an unchanged `main` cannot answer
  # differently. The exception is the whole reason a baseline exists: a base
  # image that moved under its tag, a package yanked from the registry, a
  # runner image changed beneath the pins. None of those touch a commit, and
  # none would ever be found if an unchanged tree meant silence for ever.
  #
  # So the floor is four weeks. `workflow_dispatch` always runs.
  changed:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Has main moved since the last green baseline
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'asked for by hand'
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last="$(gh api "/repos/$REPO/actions/workflows/baseline.yml/runs" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")][0]
                  | "\(.head_sha) \(.created_at)"' 2>/dev/null || true)"

          # No previous green run, so there is no record to lean on.
          if [ -z "$last" ]; then
            echo 'no previous green baseline'
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha="${last%% *}"
          last_at="${last##* }"
          echo "last green baseline: $last_sha at $last_at"
          echo "main is now: $HEAD_SHA"

          if [ "$last_sha" != "$HEAD_SHA" ]; then
            echo 'main has moved'
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last_at" +%s) ) / 86400 ))
          echo "unchanged for $age_days days"
          if [ "$age_days" -ge 28 ]; then
            echo 'four weeks since the last answer, so the world may have moved even if the tree has not'
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo 'unchanged and recently answered; nothing here could report differently'
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # **Every tier, because a baseline is asking what `main` is** rather than
  # what a diff touched. Each pays its own checkout and install, which a single
  # job did once -- bought back in parallelism, and spent only on a night the
  # tree moved.
  baseline:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      all: true
