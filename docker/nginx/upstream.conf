# The server, found by name for as long as the edge runs rather than once at
# start: a restarted server can come back at another address, and one that is
# not up yet must not stop the edge starting. `127.0.0.11` is Docker's own
# resolver on a user-defined network.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream ic_app {
    zone ic_app 64k;
    server app:8080 resolve;
}
