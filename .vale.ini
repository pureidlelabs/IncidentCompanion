StylesPath = .vale/styles

# **A vocabulary, which is the mechanism Elastic uses and this had none of.**
# Product and third-party names live here rather than being scattered through
# rule token lists as exceptions, so a terminology rule can be added without
# first re-deriving what the nouns are.
Vocab = IncidentCompanion
MinAlertLevel = warning

# **`*` matches `/` in Vale, which is not the usual glob contract**, so
# `openspec/*.md` reaches `openspec/specs/cases/spec.md` -- no depth to add.
#
# **A section naming a tree that is not there is silent.** Vale's summary counts
# files *walked*, not files linted, so a section matching nothing prints the
# same clean result as one covering every page.
# `tests/docs/test_vale_config.py` is what holds that.
# -> https://docs.vale.sh/guides/globbing

# Every tracked markdown file, so a page nobody enumerated is still covered.
# The narrower sections below replace this for the trees that earn more.
#
# **`Shared.HardWrap` is the one structural rule here, and `scope: raw` is why.**
# Every other scope is the HTML Vale renders first, where the newline it looks
# for is already gone. Measured 2026-08-29, and the FAQ is right on both: raw
# bypasses `BlockIgnores` and bypasses the inline `<!-- vale ... = NO -->`
# comment, so a fenced sample that trips it is fixed rather than exempted.
# -> https://docs.vale.sh/guides/faq
[*.md]
BasedOnStyles = Shared

[.devcontainer/*.md]
# The setup page for the container, which is operator prose and
# was linted by nothing -- which is how it grew to 299 lines of argument,
# measurement and history that belonged in a commit message.
BasedOnStyles = Shared, IncidentCompanion

[README.md]
BasedOnStyles = Shared, IncidentCompanion

# **`.claude/` takes nearly the inverse of the docs' rules.** A rule or a skill
# exists to carry the argument -- justification is the point here, and banning
# it would ban the file. What it may not do is spend its lines on how the answer
# was found, on announcing that it matters, or on describing its own rhetoric.
# -> `rules/docstrings.md`
[.claude/*.md]
BasedOnStyles = Shared, KnowledgeBase

# **A style rule has to name the thing it bans.** These four hold the cut list
# itself -- "worth writing down", "this is not hypothetical" -- as quoted
# examples, so the rule derived from them fires on its own source. Exempting
# the file is the honest form; rewriting the examples would leave the rule
# with nothing to point at.
[.claude/{rules/docstrings,skills/docstring-economy/SKILL}.md]
KnowledgeBase.AnnouncingImportance = NO
KnowledgeBase.RouteToTheAnswer = NO
KnowledgeBase.ProseAboutProse = NO

# **Same exemption, one rule.** `claim-homes.md` names the words that mark a
# sentence describing the present tree -- `already`, `today`, `currently` -- so
# the rule banning them fires on the list itself. Quoting them is the point:
# a reader recognises the tell faster than the principle.
[.claude/rules/claim-homes.md]
Shared.RelativeTime = NO

# `rules/writing-style.md` is the whole cut list with a worked example beside
# each entry, so every rule in `Shared` fires on its own source. Same exemption
# as the docstring files above, and for the same reason.
[.claude/rules/writing-style.md]
BasedOnStyles = ''
Shared.HardWrap = YES

# **Vale lints source-code comments, and this repository had never asked it
# to.** An earlier note here said Vale "reaches no `.ts` file at all"; it
# measured this file rather than Vale, which supports comment scopes for
# TypeScript and Python among many others. -> https://docs.vale.sh/formats/code
#
# `[formats]` maps the extension to markdown so backticks, `TokenIgnores` and
# the rest work inside a comment. Only `Shared` applies: `Interface` is for
# strings an analyst reads and `KnowledgeBase` for notes.
#
# **Measured before switching it on**: 99 errors across these trees, of which
# `RelativeTime` was 24 -- the drift this is here for, since its message is
# *was true when it was written* and a docstring saying `currently there is no
# X` is one refactor from a lie.
[formats]
ts = md
tsx = md
py = md
yml = md

# **The vocabulary rules transfer to code and the positional ones do not**,
# measured the day the sections were added rather than assumed:
#
# | rule            | hits | genuine |
# | --------------- | ---- | ------- |
# | RelativeTime    |  24  |    3    |
# | Directional     |  11  |    2    |
# | DirectionalHere |  44  |    0    |
#
# The reason is a word sense the rule cannot see. In prose `currently` means
# *as of writing*, which is the drift these rules exist for. In a comment it
# almost always means *at this instant of execution* -- "the values currently
# in the form", "where the router currently is" -- which is correct English,
# and rewriting it makes the prose worse. `above`/`below` go the same way:
# in a comment they mean the line, and on a screen they describe where a
# control renders, which `Directional`'s own note already allows.
#
# Three rules off, then, and every vocabulary rule kept: `Terminology`,
# `Spelling`, `LatinAbbrev`, `Redundancy`, `Filler`, `Inclusive`,
# `DefaultBranch`, `Exclamation`, `Courtesy`, `LinkText`. Those found 21 real
# corrections here on the first run.
[{server,ui/src,tests}/**/*.{ts,tsx,py}]
BasedOnStyles = Shared, KnowledgeBase, Verbosity
Shared.DirectionalHere = NO
Shared.Directional = NO
Shared.RelativeTime = NO
Shared.HardWrap = NO

# **The workflows and the issue forms, which nothing linted.** A comment in
# `ci.yml` is prose a contributor reads before their first pull request, and
# it sat outside every section here -- two `AnnouncingImportance` hits were
# written into `ci.yml` on the branch that added this line.
#
# `yml = md` in `[formats]` is what makes a `#` comment reachable at all.
# The same three rules go off for the same reason as the source trees.
#
# **A `run:` block is read too, strings included**, because the format map
# hands Vale the whole file rather than its comments. That is right more
# often than not -- a `console.log` in a workflow is read by whoever is
# debugging the run -- but it is why a shell literal can be linted here.
[.github/**/*.yml]
BasedOnStyles = Shared, KnowledgeBase
Shared.DirectionalHere = NO
Shared.Directional = NO
Shared.RelativeTime = NO
Shared.HardWrap = NO

# **A workflow comment has no assertion beside it**, so a measurement in one is
# arguing for the change rather than explaining the code. `Pipeline` is scoped
# here and not to the source trees, where `rules/docstrings.md` sanctions the
# same words next to the test they justify. The issue forms are excluded by the
# glob: a `placeholder:` and a dropdown label are content, not comments.
[.github/workflows/*.yml]
BasedOnStyles = Shared, KnowledgeBase, Pipeline
Shared.DirectionalHere = NO
Shared.Directional = NO
Shared.RelativeTime = NO
Shared.HardWrap = NO

[.claude/{hooks,scripts,tests}/*.py]
BasedOnStyles = Shared
Shared.DirectionalHere = NO
Shared.Directional = NO
Shared.RelativeTime = NO
Shared.HardWrap = NO

# **OpenSpec's own commands and skills, installed rather than written here.**
# Their frontmatter says `author: openspec` and `license: MIT`, and `openspec
# update` rewrites them wholesale -- so an edit to clear a lint survives until
# the next version lands. Vendored guidance rather than ours to lint.
[.claude/commands/opsx/*.md]
BasedOnStyles = ''

[.claude/skills/openspec-*/SKILL.md]
BasedOnStyles = ''

# **A ratchet on the new tier, not an audit of the old one.** Component docs are
# reference entries: a caller opens one while choosing between two components,
# so the argument belongs in the capability's `design.md` and the measurement
# in the commit message that acted on it. -> `rules/claim-homes.md`
#
# **Every block, red where the comb has not reached.** This took an `*.aria.*`
# glob while the ReUI originals stood beside their React Aria twins, and a
# separate list for the five that never grew a twin -- `detail-grid`'s page read
# as an essay for exactly that long. Both the originals and the infix are gone,
# so one glob covers the tier and the remaining count is the backlog.
#
# A fourth rule, banning the bolded essay opener, was written and dropped: Vale
# parses these comments as markdown, so `**...**` is markup by the time a rule
# sees it and the pattern matched nothing. Nothing enforces that half.

[ui/src/components/blocks/*.{tsx,stories.tsx}]
BasedOnStyles = Shared, ComponentDocs
Shared.DirectionalHere = NO
Shared.Directional = NO
Shared.RelativeTime = NO
Shared.HardWrap = NO

# **The kit, as the comb reaches it.** A component's documentation lives in its
# meta and story JSDoc rather than in a sibling `.mdx`: the props table is
# generated from the types, autodocs assembles the page, and the MCP server
# hands the whole thing to an agent already structured. A second file would be
# the second description `rules/claim-homes.md` refuses.
#
# **An `.mdx` here was linted by nothing.** `[formats]` maps `ts`, `tsx` and
# `py`; `.mdx` is in neither that nor any section, and `[*.md]` does not reach
# it -- `vale ui/src/components/ui/table.mdx` answered `0 files`, which is the
# silent-section trap this file warns about at the top.
#
# **The whole kit, red where it has not been combed, and that is the point.**
# The blocks tier took a file list so its gate would be green on arrival; here
# the count of remaining errors is the backlog, and it is wanted visible rather
# than hidden behind a list that has to be edited to reveal the next one. It
# only goes down.
[ui/src/components/ui/*.{tsx,stories.tsx}]
BasedOnStyles = Shared, ComponentDocs
Shared.DirectionalHere = NO
Shared.Directional = NO
Shared.RelativeTime = NO
Shared.HardWrap = NO
